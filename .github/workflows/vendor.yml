name: Kütüphaneleri indir ve yayınla
on:
  push:
    branches: [main]
    paths-ignore: ["vendor/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kütüphaneleri indir
        run: |
          mkdir -p vendor
          curl -fsSL https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js -o vendor/xlsx.full.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js -o vendor/chart.umd.min.js
          ls -l vendor
      - name: Değişiklik varsa commit et
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add vendor
          git diff --cached --quiet || (git commit -m "vendor: xlsx 0.18.5 ve chart.js 4.4.0 yerel kopyaları" && git push)
